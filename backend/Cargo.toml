[package]
name = "purrce-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "rustls-tls", "cookies"], default-features = false }
# Impersonating HTTP client (TLS/JA3 + HTTP/2 fingerprint). Used only by the scraper.
wreq = { version = "0.16", features = ["gzip", "brotli", "cookies", "socks"] }
wreq-util = "0.2"
cookie = "0.18"
http = "1"
tower-http = { version = "0.6", features = ["trace", "fs", "timeout", "set-header"] }
url = "2"
dotenvy = "0.15"
scraper = "0.21"
html-escape = "0.2"
rand = "0.9"
regex = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }

[profile.release]
opt-level = 2        # ~30% faster build vs opt-level 3; negligible runtime diff for IO-bound code
codegen-units = 4    # parallel codegen; default is 1 in release
lto = false          # off: saves link time in Docker where incremental isn't used
