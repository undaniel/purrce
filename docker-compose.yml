services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: purrce
      POSTGRES_PASSWORD: purrce
      POSTGRES_DB: purrce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purrce"]
      interval: 5s
      timeout: 5s
      retries: 5

  purrce:
    image: purrce:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://purrce:purrce@postgres:5432/purrce
      RUST_LOG: purrce_backend=debug,tower_http=info
      FRONTEND_DIR: /app/frontend/build
      OBSCURA_BIN: /usr/local/bin/obscura
      OBSCURA_TIMEOUT: 30
      OBSCURA_STORAGE_DIR: /app/data/obscura
      OBSCURA_MAX_CONCURRENCY: 3
      OBSCURA_V8_FLAGS: "--max-old-space-size=256"
      OBSCURA_SCRIPT_DEADLINE_MS: 20000
      DEFAULT_CURRENCY: CLP
      # HTTP_PROXY: http://proxy:8080
      # HTTPS_PROXY: http://proxy:8080
      # PROXY_URL: socks5://proxy:1080
    volumes:
      - obscura_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres_data:
  obscura_data:
